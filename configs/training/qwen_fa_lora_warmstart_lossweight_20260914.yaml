# C 臂（备用，尚未跑）：只给**长字符的结束点槽位**加权，不复制条目 ⇒ 不受条目级复制的 ×2.58 饱和限制。
# 为什么 slot=offset 而不是 both：今晚实测长字符的**起始点**已经够准
