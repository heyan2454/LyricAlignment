schema_version: inline_realign_multilingual_experiment_config_v4_full_mechanism
mode: smoke
purpose: representative end-to-end validation of the full window, silence, stable, realign, decoder, visualization and resume suite
selection:
  demo_policy: one_per_discovered_language_when_available
  demo_total_cap: null
  demo_per_language_cap: 1
  mir1k_roles: [development, quick_v2_extra]
  mir1k_cap: 6
  include_mir1k_heldout: false
  m4singer_validation_native_cap: 8
  m4singer_synthetic_long_total_cap: 6
  m4singer_synthetic_long_target_seconds: [60, 120, 180]
variants:
  primary: B2_30_silence_official
  window_matrix:
    - B0_60_fixed_official
    - B1_30_fixed_official
    - B2_30_silence_official
    - B4_60_silence_official
    - B5_30_strict_silence_official
    - B6_60_strict_silence_official
    - C0_30_silence_compressed_diagnostic
    - C1_60_silence_compressed_diagnostic
  raw_control: B3_30_silence_raw_control
window_parameters:
  strict_silence_boundary_sec: 1.5
  silence_compression_min_sec: 1.5
  silence_compression_padding_sec: 0.20
shadow:
  automatic_writeback: false
  gt_oracle_cases_per_item: 2
  clean_control_cases_per_item: 2
  stable_window_trials_per_item: 3
  text_dosage_trials_per_item: 3
  pending_cases_per_item: 3
  tail_rollback_cases_per_item: 0
  local_context_units: [0, 2, 4]
  gate_variants: [strict_decrease_control, structural_nonincrease, zero_duration_relaxed, context_median_fusion]
  stable_anchor:
    enabled: true
    audio_text_synchronized: true
    variants: [anchor_only, sync_exact, sync_minus2, sync_minus4]
  text_dosage:
    enabled: true
    end_deltas: [-8, -4, -2, 0, 2, 4, 8, 16]
    start_deltas: [-4, -2, 0, 2, 4]
  deferred_realign:
    enabled: true
    immediate_inline: true
    max_windows: 3
    max_seconds: 120
    max_units: 320
visualization:
  enabled: true
  all_items_static: true
  render_mode: after
  render_profile: review
  timeline_page_seconds: 30
  comparison_branches:
    - B0_60_fixed_official
    - B1_30_fixed_official
    - B2_30_silence_official
    - B4_60_silence_official
    - B5_30_strict_silence_official
    - B6_60_strict_silence_official
  language: Chinese
  character_rainbow: true
  duration_distribution: discrete_pmf_including_negative_zero_positive
  inconsistency_panels: [index_time_lines, maximum_spread, heatmap]
reporting:
  group_by: [dataset, profile, language, alignment_unit_mode, duration_bucket, variant]
  total_metrics: true
  synthetic_seam_near_far_separate: true
  automatic_oracle_manual_separate: true
collection:
  max_total_mib: 12
  level: compact
  max_cases_per_item: 3
  include_visual_index: true
  exclude: [audio, video, model_weights, full_logs, full_alignment_payloads]
