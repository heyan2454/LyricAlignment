schema_version: inline_realign_multilingual_experiment_config_v3
mode: formal
purpose: full development experiment for multilingual long-range alignment, decoder, detector, stable-anchor and local/deferred realign
selection:
  demo_policy: all_discovered_prepared_items
  demo_total_cap: null
  demo_per_language_cap: null
  current_demo_counts_are_metadata_not_contract: true
  mir1k_roles: [development, quick_v2_extra, spare]
  mir1k_cap: 16
  include_mir1k_heldout: false
  m4singer_validation_native_cap: 32
  m4singer_synthetic_long_total_cap: 18
  m4singer_synthetic_long_target_seconds: [60, 120, 180]
variants:
  primary: B2_30_silence_official
  baseline_matrix_policy: all_long_serial
  raw_control_policy: always_for_long_serial
  comparison_video_branches:
    - RAW_B2
    - B0_60_fixed_official
    - B1_30_fixed_official
    - B2_30_silence_official
shadow:
  automatic_writeback: false
  gt_oracle_cases_per_item: 3
  clean_control_cases_per_item: 2
  stable_window_trials_per_item: 3
  expansion_trials_per_item: 2
  pending_cases_per_item: 3
  tail_rollback_cases_per_item: 0
  local_context_units: [0, 2, 4]
  consensus: any_pair_agrees
  stable_anchor:
    enabled: true
    left_overlap_units: 8
    variants: [stable_inclusive, stable_left_overlap, stable_frozen_overlap]
  deferred_realign:
    enabled: true
    immediate_inline: true
    delayed_inline_after_anchor_recovery: true
    bounded_final_sweep: true
    max_windows: 3
    max_seconds: 120
    max_units: 320
visualization:
  enabled: true
  all_items_static: true
  demo_comparison_video: true
  demo_behavior_video: true
  render_profile: review
  timeline_page_seconds: 60
  duration_histogram_bin_ms: 5
  duration_histogram_max_ms: 500
  comparison_branches:
    - RAW_B2
    - B0_60_fixed_official
    - B1_30_fixed_official
    - B2_30_silence_official
reporting:
  group_by: [dataset, profile, language, alignment_unit_mode, duration_bucket, variant]
  total_metrics: true
  synthetic_seam_near_far_separate: true
  automatic_oracle_clean_separate: true
collection:
  max_total_mib: 8
  level: compact
  max_cases_per_item: 4
  include_visual_index: true
  exclude: [audio, video, model_weights, full_logs, full_alignment_payloads]
