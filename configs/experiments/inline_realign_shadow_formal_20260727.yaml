schema_version: inline_realign_experiment_config_v1
mode: formal
purpose: development-only baseline decomposition and shadow intervention evaluation
selection:
  demo_cap: 6
  demo_baseline_matrix_cap: 2
  mir1k_development_cap: 8
  mir1k_baseline_matrix_cap: 4
  m4singer_validation_native_cap: 8
  m4singer_validation_synthetic_long_cap: 4
  m4singer_synthetic_long_baseline_matrix_cap: 2
  include_mir1k_heldout: false
  max_shadow_cases_per_item: 8
variants:
  baseline_matrix:
    - B0_60_fixed_official
    - B1_30_fixed_official
    - B2_30_silence_official
    - B3_30_silence_raw_control
  primary: B2_30_silence_official
inline_realign:
  writeback: false
  stable_segment_min_units: 2
  confidence_quantile: 0.50
  raw_official_tolerance_sec: 0.16
  repeated_context_tolerance_sec: 0.24
  exact_plus_context_units: 2
  context_agreement_tolerance_sec: 0.24
collection:
  max_total_mib: 8
  fallback_order: [full, anomaly, severe]
  exclude_audio_video_weights: true
interpretation:
  demo: structural_and_listening_only
  m4singer_synthetic_long: report_seams_separately
  mir1k_heldout: run_only_after_rules_frozen
