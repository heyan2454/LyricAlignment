  minimum_core_sec: 12

audio_preprocessing:
  main: compress_long_silence
  control: original
  min_original_silence_sec: 5.0
  retained_total_sec: 3.0   # pilot 3s/5s 对比后冻结；pilot 前以 pilot 值覆盖运行
  retained_distribution: centered
  boundary_guard_sec: 0.5
  require_original_time_mapping: true

align:
  main_query_mode: full_slot
  unit_density_sec: 1.2
  lookback_units: 8
  timestamp_segment_sec: 0.08
  decoder_top_k: 8
  decoder_beam_size: 96

transition:
  candidates:
    - T0_oracle_independent
    - T1_direct_serial
    - T2_core_boundary_serial
    - T3_stable_boundary_serial
  detector_disabled_during_primary_comparison: true
  stability_tolerance_sec: 0.32

data:
  primary_gt: M4
  long_timeline_manifest: runs/research_transition_recovery_detector_20260807/long_manifest_60/LONG_TIMELINE_MANIFEST.jsonl
  audio_root: /home/hyan/Data/datasets/m4singer/raw/extracted/m4singer
  fixed_transfer: MIR1K
  test_demo_auto_discovery: true
  test_demo_has_gt: false

detector:
  required_operating_points: [SA60, SA80, R95]
  r95_definition: unsafe_reject_recall
  uncertain_counts_as_reject: false
  joint_sa60_r95_attempt: true
  continue_if_joint_infeasible: true

recovery:
  controls: [none, shadow, local_L, whole_window_W]
  primary_closed_loop: [L_SA60, L_SA80, L_R95, W_R95]
  require_unique_route_plan: true

propagation:
  source_priority: [natural, model_native_forced_commit, canonical_state_corruption, simple_sanity_only]
  target_effective_episodes_per_major_family: 64
  min_followup_windows: 2
  max_followup_windows: 5
  count_rejected_before_commit_as_propagated: false
